<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="./sakura.png">
<link rel="apple-touch-icon" href="./sakura.png">
<title>SAKURA COUNTDOWN</title>
<style>
  :root{
    --text:#fff;
    --accent:#ff87b2;
    /* == ガラス共通 == */
    --glass-line:rgba(255,255,255,.25);
    --glass-bg:
      linear-gradient(
        135deg,
        var(--card-glass-1),
        var(--card-glass-2) 48%,
        var(--card-glass-3)
      );
    --glass-highlight:rgba(255,255,255,.26);
    --glass-shadow:rgba(0,0,0,.22);
    --card-glass-1:rgba(255,255,255,.40);
    --card-glass-2:rgba(255,255,255,.20);
    --card-glass-3:rgba(255,255,255,.08);
    --control-glass-1:rgba(255,255,255,.13);
    --control-glass-2:rgba(255,255,255,.045);
    --sheet-glass-1:rgba(255,255,255,.88);
    --sheet-glass-2:rgba(255,255,255,.72);
    --item-h:50px;
    --view-h:150px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  .item .ttl,
  .item .card-date,
  .item .count,
  .item .count small,
  .sheet,
  .sheet .tinput,
  .sheet .reel .it,
  .sheet .unit,
  .sheet .colon,
  .sheet .sheet-hint,
  .sheet .gbtn{
    text-shadow:0 2px 5px rgba(0,0,0,.68), 0 1px 2px rgba(0,0,0,.48);
  }
  .sheet .tinput{
    color:#fff;
    -webkit-text-fill-color:#fff;
    text-shadow:
      0 1px 2px rgba(0,0,0,.55),
      0 2px 5px rgba(0,0,0,.28);
  }
  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent
  }
  html,body{
    margin:0;
    width:100%;
    height:100%;
    min-height:100%;
    overflow:hidden;
    /* iOS standalone can leave the bottom safe-area outside fixed layers. */
    background-color:#000;
  }
  html{
    height:100%;
    min-height:100dvh;
  }
  body{
    min-height:100dvh;
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "SF Pro JP",
      "Hiragino Sans",
      "Noto Sans JP",
      "Yu Gothic",
      Meiryo,
      sans-serif;
    color:var(--text);
    touch-action:manipulation;
    -webkit-font-smoothing:antialiased;
  }
  /* === 背景 === */
  .bg{
    position:fixed;
    inset:0;
    z-index:0;
    width:100%;
    /* Use the largest viewport in standalone mode so the layer also covers
       the area revealed/occupied by the iPhone bottom safe area. */
    height:100lvh;
    min-height:100dvh;
    background-color:#000;
    background-image:url("background.PNG");
    background-position:55% center;
    background-size:cover;
    background-repeat:no-repeat;
  }
  .bg::after{
    content:"";
    position:absolute;
    inset:0;
    background-color:#000;
    background-image:url("background-dark.PNG");
    background-position:55% center;
    background-size:cover;
    background-repeat:no-repeat;
    opacity:0;
    pointer-events:none;
    transition:opacity .8s ease;
  }
  .bg.dark::after{
    opacity:1;
  }
  @media (prefers-reduced-motion:reduce){
    .bg::after{
      transition:none;
    }
  }
  .sakura-layer{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    transition:opacity .18s ease;
  }
  .sakura-layer.hidden{
    visibility:hidden;
    opacity:0;
  }
  canvas{
    pointer-events:none;
  }
  /* === 共通ガラス === */
  .glass{
    border:1px solid var(--glass-line);
    background:
      linear-gradient(
        145deg,
        var(--control-glass-1),
        var(--control-glass-2)
      );
    box-shadow:
      inset 0 1px 1px var(--glass-highlight),
      inset 0 -1px 1px rgba(0,0,0,.08),
      0 12px 34px var(--glass-shadow);
  }
  /* === レイアウト === */
  .app{
    position:relative;
    z-index:2;
    width:min(100%,780px);
    height:100%;
    min-height:100dvh;
    margin:auto;
    padding:calc(10px + var(--safe-t)) 18px 0;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    flex:0 0 auto;
    position:relative;
    min-height:70px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:6px 42px 10px;
  }
  .brand{
    font-size:clamp(14px,4.2vw,21px);
    font-weight:600;
    letter-spacing:.16em;
    text-indent:.16em;
    white-space:nowrap;
    opacity:.95;
    text-shadow:0 2px 12px rgba(0,0,0,.45);
  }
  .now{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:clamp(12px,4vw,22px);
    font-size:clamp(13px,4vw,18px);
    font-weight:300;
    letter-spacing:.04em;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 9px rgba(0,0,0,.4);
    white-space:nowrap;
  }
  .iconbtn{
    -webkit-appearance:none;
    appearance:none;
    border:0;
    background:transparent;
    padding:0;
    margin:0;
    color:#fff;
    display:grid;
    place-items:center;
    cursor:pointer;
  }
  .topbar .menu{
    position:absolute;
    right:0;
    top:calc(50% - 20px);
    width:40px;
    height:40px;
    border-radius:50%;
  }
  .hamburger{
    display:flex;
    flex-direction:column;
    gap:6px;
    width:24px;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))
  }
  .hamburger span{
    height:2px;
    width:24px;
    background:#fff;
    border-radius:2px;
    transition:.26s cubic-bezier(.3,.9,.3,1)
  }
  .menu.open .hamburger span:nth-child(1){
    transform:translateY(8px) rotate(45deg)
  }
  .menu.open .hamburger span:nth-child(2){
    opacity:0;
    transform:scaleX(.3)
  }
  .menu.open .hamburger span:nth-child(3){
    transform:translateY(-8px) rotate(-45deg)
  }
  /* === リスト === */
  .list{
    flex:1 1 auto;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:4px 2px calc(130px + var(--safe-b));
    overscroll-behavior:contain;
  }
  .list::-webkit-scrollbar{
    display:none
  }
  .list.locked{
    overflow:hidden
  }
  .row{
    position:relative;
    margin:0 0 14px;
    border-radius:22px;
    transition:transform .2s cubic-bezier(.2,.9,.25,1);
  }
  .row.dragging{
    z-index:5;
    transition:none
  }
  .row.removing{
    transition:
      transform .26s ease,
      opacity .26s ease,
      height .26s ease,
      margin .26s ease
  }
  @keyframes pop{
    from{
      opacity:0;
      transform:translateY(12px)
    }
    to{
      opacity:1;
      transform:none
    }
  }
  .row.pop{
    animation:pop .34s cubic-bezier(.2,.9,.25,1) both
  }
  /* === 削除背景 === */
  .row-bg{
    position:absolute;
    top:0;
    right:0;
    bottom:0;
    width:var(--delete-width,0px);
    border-radius:0 22px 22px 0;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    padding-right:0;
    opacity:0;
    transition:opacity .16s,background .2s;
    cursor:pointer;
    z-index:0;
  }
  .row.swiping .row-bg,
  .row.open .row-bg{
    opacity:1;
    background:rgba(255,60,105,.62);
  }
  .row.armed .row-bg{
    background:rgba(255,60,105,.62);
  }
  .row-bg .trash{
    width:26px;
    height:26px;
    opacity:.96;
    transition:transform .18s cubic-bezier(.2,.9,.25,1)
  }
  .row.armed .row-bg .trash{
    transform:scale(1.22)
  }
  /* === カード === */
  .item{
    position:relative;
    z-index:1;
    padding:20px 22px 22px;
    border-radius:22px;
    overflow:hidden;
    background:
      linear-gradient(
        135deg,
        var(--card-glass-1),
        var(--card-glass-2) 48%,
        var(--card-glass-3)
      );
    text-shadow:0 2px 8px rgba(0,0,0,.30);
    touch-action:pan-y;
    cursor:pointer;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.27),
      inset 0 -1px 1px rgba(0,0,0,.08);
  }
  .item::before{
    content:"";
    position:absolute;
    inset:1px;
    border-radius:21px;
    pointer-events:none;
    background:
      linear-gradient(
        120deg,
        rgba(255,255,255,.18),
        transparent 30%,
        transparent 72%,
        rgba(255,255,255,.055)
      );
  }
  .row.dragging .item{
    will-change:transform;
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.38),
      inset 0 -1px 1px rgba(0,0,0,.08);
    background:
      linear-gradient(
        135deg,
        rgba(255,255,255,.19),
        rgba(255,255,255,.065)
      );
    border-color:rgba(255,255,255,.42);
  }
  .label{
    position:relative;
    z-index:1;
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size:20px;
    line-height:1.25;
    font-weight:600;
    margin-bottom:6px;
    min-width:0;
    padding-right:26px;
  }
  .label .ttl{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0
  }
  .card-date{
    flex:0 0 auto;
    font-size:12px;
    font-weight:400;
    opacity:.9;
    letter-spacing:.02em;
    white-space:nowrap;
    font-variant-numeric:tabular-nums
  }
  .count{
    position:relative;
    z-index:1;
    display:block;
    font-size:clamp(32px,8vw,62px);
    line-height:1.08;
    font-weight:600;
    letter-spacing:-.02em;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }
  .count .n{
    display:inline-block;
    min-width:2ch;
    text-align:right;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 5px rgba(0,0,0,.68), 0 1px 2px rgba(0,0,0,.48);
  }
  .count small{
    font-size:.74em;
    font-weight:600;
    letter-spacing:-.01em;
    opacity:.96
  }
  .item.past .count{
    color:#ffd3e2;
  }
  .item.soon .count{
    color:#fff0f5;
    text-shadow:
      0 0 18px rgba(255,120,170,.65),
      0 2px 8px rgba(0,0,0,.3)
  }
  .item.soon::after{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:22px;
    pointer-events:none;
    border:1px solid rgba(255,150,185,.55);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:.25}
    50%{opacity:.85}
  }
  .bar{
    position:relative;
    z-index:1;
    margin-top:12px;
    height:3px;
    border-radius:3px;
    background:rgba(255,255,255,.16);
    overflow:hidden
  }
  .bar i{
    display:block;
    height:100%;
    width:0;
    border-radius:3px;
    background:linear-gradient(
      90deg,
      rgba(255,255,255,.75),
      var(--accent)
    )
  }
  .bell-dot{
    position:absolute;
    right:18px;
    top:18px;
    z-index:1;
    opacity:.85
  }
  .bell-dot svg{
    width:15px;
    height:15px
  }
  /* === FAB === */
  .fab{
    position:fixed;
    z-index:6;
    right:max(20px,env(safe-area-inset-right,0px));
    bottom:calc(22px + var(--safe-b));
    width:72px;
    height:72px;
    border-radius:50%;
    border:1px solid var(--glass-line);
    background:var(--glass-bg);
    box-shadow:
      inset 0 1px 1px var(--glass-highlight),
      0 14px 34px rgba(0,0,0,.28),
      0 12px 34px var(--glass-shadow);
    cursor:pointer;
    transition:transform .18s cubic-bezier(.2,.9,.25,1);
  }
  .fab:active{
    transform:scale(.92)
  }
  .fab:before,
  .fab:after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    background:rgba(255,255,255,.95);
    border-radius:2px;
    transform:translate(-50%,-50%);
    box-shadow:0 1px 4px rgba(0,0,0,.18);
  }
  .fab:before{
    width:26px;
    height:2px
  }
  .fab:after{
    width:2px;
    height:26px
  }
  /* === 設定パネル === */
  .panel{
    position:fixed;
    z-index:8;
    top:calc(72px + var(--safe-t));
    right:16px;
    width:min(320px,calc(100vw - 32px));
    border-radius:22px;
    padding:16px;
    transform:translateY(-12px) scale(.96);
    opacity:0;
    pointer-events:none;
    transform-origin:100% 0;
    transition:.24s cubic-bezier(.2,.9,.25,1);
    backdrop-filter:blur(22px) saturate(130%);
    -webkit-backdrop-filter:blur(22px) saturate(130%);
  }
  .panel.show{
    opacity:1;
    transform:none;
    pointer-events:auto
  }
  .prow{
    display:flex;
    align-items:center;
    gap:14px;
    padding:8px 6px
  }
  .prow .ic{
    width:26px;
    height:26px;
    display:grid;
    place-items:center;
    opacity:.95;
    flex:0 0 auto
  }
  .prow .sp{
    flex:1;
    min-width:0
  }
  button.prow{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    border:0;
    background:transparent;
    color:inherit;
    font:inherit;
    text-align:left;
    cursor:pointer;
    border-radius:14px;
    transition:background .18s;
  }
  button.prow:active{
    background:rgba(255,255,255,.10)
  }
  #sortLabel{
    font-size:13px;
    opacity:.88;
    letter-spacing:.05em;
    font-variant-numeric:tabular-nums
  }
  #sortBtn .chev{
    transition:transform .26s cubic-bezier(.2,.9,.25,1);
    opacity:.7
  }
  #sortBtn.desc .chev{
    transform:rotate(180deg)
  }
  #sakuraToggle .sakura-status{
    font-size:12px;
    opacity:.62;
    letter-spacing:.04em
  }
  #sakuraToggle.paused .sakura-status{
    opacity:.9;
    color:#ffd7e6
  }
  #sakuraToggle .sp{
    font-weight:400;
    letter-spacing:.02em
  }
  #sakuraToggle .sw{
    margin-left:auto
  }
  #sakuraToggle .ic{
    color:#fff
  }
  #sakuraToggle .ic.sakura-letter{
    width:26px;
    height:26px;
    border:1.5px solid currentColor;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
    font-size:15px;
    line-height:1;
    font-weight:600;
    letter-spacing:0;
    font-family:inherit;
    text-align:center;
  }
  #sakuraToggle .ic svg{
    display:block;
    width:23px;
    height:23px
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:4px 6px 0;
    transition:opacity .2s
  }
  .chips.off{
    opacity:.34
  }
  .chip{
    font-size:11px;
    padding:4px 9px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.24);
    background:rgba(255,255,255,.09);
    font-variant-numeric:tabular-nums;
    letter-spacing:.02em;
  }
  .chip.now{
    background:rgba(255,135,178,.48);
    border-color:rgba(255,190,214,.6)
  }
  .divider{
    height:1px;
    background:rgba(255,255,255,.15);
    margin:12px 4px
  }
  .sw{
    width:52px;
    height:31px;
    border-radius:16px;
    flex:0 0 auto;
    cursor:pointer;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.28);
    position:relative;
    transition:.24s cubic-bezier(.2,.9,.25,1);
  }
  .sw.on{
    background:
      linear-gradient(
        90deg,
        rgba(255,135,178,.75),
        rgba(255,105,160,.88)
      );
    border-color:rgba(255,200,220,.55)
  }
  .sw i{
    position:absolute;
    top:2px;
    left:2px;
    width:25px;
    height:25px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.28);
    transition:.24s cubic-bezier(.2,.9,.25,1)
  }
  .sw.on i{
    transform:translateX(21px)
  }
  .shake{
    animation:shake .38s
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-7px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(3px)}
  }
  /* === シート === */
  .scrim{
    position:fixed;
    inset:0;
    z-index:9;
    background:rgba(10,10,12,.18);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    opacity:0;
    pointer-events:none;
    transition:opacity .28s;
  }
  .scrim.show{
    opacity:1;
    pointer-events:auto
  }
  .sheet{
    position:fixed;
    z-index:10;
    left:50%;
    bottom:0;
    width:min(100%,520px);
    transform:translate(-50%,110%);
    border-radius:30px 30px 0 0;
    padding:10px 20px calc(20px + var(--safe-b));
    transition:transform .34s cubic-bezier(.22,.9,.24,1);
    will-change:transform;
    background:
      linear-gradient(
        145deg,
        var(--control-glass-1),
        var(--control-glass-2)
      );
    box-shadow:
      inset 0 1px 1px var(--glass-highlight),
      inset 0 -1px 1px rgba(0,0,0,.08),
      0 12px 34px var(--glass-shadow);
    backdrop-filter:blur(22px) saturate(130%);
    -webkit-backdrop-filter:blur(22px) saturate(130%);
  }
  .sheet.show{
    transform:translate(-50%,0)
  }
  .grip{
    width:42px;
    height:5px;
    border-radius:3px;
    background:rgba(255,255,255,.50);
    margin:2px auto 12px;
    cursor:grab;
    touch-action:none
  }
  .tinput{
    width:100%;
    display:block;
    -webkit-appearance:none;
    appearance:none;
    border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.075);
    color:#fff;
    font-size:24px;
    font-weight:600;
    padding:13px 16px;
    border-radius:15px;
    text-align:center;
    letter-spacing:.02em;
    font-family:inherit;
    outline:none;
  }
  .tinput::placeholder{
    color:rgba(255,255,255,.50);
    font-weight:600;
    font-size:20px;
    letter-spacing:.3em;
    text-indent:.3em
  }
  .tinput:focus{
    border-color:rgba(255,160,195,.75);
    background:rgba(255,255,255,.11)
  }
  .picker{
    position:relative;
    height:var(--view-h);
    margin:16px 0 6px;
    user-select:none;
    -webkit-user-select:none
  }
  .band{
    position:absolute;
    left:-4px;
    right:-4px;
    top:50px;
    height:50px;
    border-radius:13px;
    pointer-events:none;
    background:rgba(255,255,255,.11);
    border-top:1px solid rgba(255,255,255,.25);
    border-bottom:1px solid rgba(255,255,255,.25);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  }
  .reels{
    position:relative;
    height:100%;
    display:flex;
    align-items:stretch;
    justify-content:center;
    gap:0;
    -webkit-mask-image:
      linear-gradient(
        180deg,
        transparent 0,
        #000 24%,
        #000 76%,
        transparent 100%
      );
    mask-image:
      linear-gradient(
        180deg,
        transparent 0,
        #000 24%,
        #000 76%,
        transparent 100%
      );
  }
  .reel{
    position:relative;
    height:100%;
    overflow:hidden;
    perspective:760px;
    touch-action:none;
    cursor:grab;
  }
  .reel:active{
    cursor:grabbing
  }
  .reel .it{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:var(--item-h);
    display:grid;
    place-items:center;
    font-size:21px;
    font-weight:400;
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
    will-change:transform,opacity;
    backface-visibility:hidden;
  }
  .reel .it.sel{
    font-weight:600;
    text-shadow:0 2px 5px rgba(0,0,0,.68), 0 1px 2px rgba(0,0,0,.48);
  }
  .unit{
    align-self:center;
    font-size:12px;
    opacity:.8;
    padding:0 2px 0 1px;
    transform:translateY(1px)
  }
  .colon{
    align-self:center;
    font-size:20px;
    opacity:.85;
    padding:0 2px;
    transform:translateY(-1px)
  }
  .w-y{width:92px}
  .w-m{width:56px}
  .w-d{width:56px}
  .w-h{width:58px}
  .w-i{width:58px}
  .sheet-actions{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:14px
  }
  .sheet-actions .spacer{
    flex:1
  }
  .gbtn{
    -webkit-appearance:none;
    appearance:none;
    cursor:pointer;
    width:54px;
    height:54px;
    border-radius:50%;
    border:1px solid var(--glass-line);
    background:
      linear-gradient(
        145deg,
        rgba(255,255,255,.16),
        rgba(255,255,255,.055)
      );
    box-shadow:
      inset 0 1px 1px var(--glass-highlight),
      0 8px 20px rgba(0,0,0,.22);
    color:#fff;
    display:grid;
    place-items:center;
    transition:
      transform .16s cubic-bezier(.2,.9,.25,1),
      background .2s,
      opacity .2s;
  }
  .gbtn:active{
    transform:scale(.9)
  }
  .gbtn.ok{
    background:
      linear-gradient(
        145deg,
        rgba(255,150,190,.82),
        rgba(255,95,150,.76)
      );
    border-color:rgba(255,205,225,.60)
  }
  .gbtn.bell.off{
    opacity:.42
  }
  .gbtn svg{
    width:23px;
    height:23px
  }
  .sheet-hint{
    text-align:center;
    font-size:11px;
    letter-spacing:.06em;
    opacity:.62;
    margin-top:12px;
    font-variant-numeric:tabular-nums;
  }
  /* === Responsive === */
  @media (max-width:420px){
    .app{
      padding-left:14px;
      padding-right:14px
    }
    .item{
      padding:17px 17px 19px
    }
    .label{
      font-size:18px;
      gap:8px
    }
    .w-y{width:84px}
    .w-m{width:50px}
    .w-d{width:50px}
    .w-h{width:52px}
    .w-i{width:52px}
    .fab{
      width:64px;
      height:64px
    }
  }
  @media (min-width:760px){
    .item{
      padding:24px 26px 26px
    }
  }
  @media (prefers-reduced-motion:reduce){
    *{
      animation-duration:.001ms!important
    }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="sakura-layer" id="sakura" aria-hidden="true"></div>
  <main class="app">
    <header class="topbar">
      <div class="brand">SAKURA COUNTDOWN</div>
      <div class="now" id="now">
        <span id="nowDate">---- / -- / --</span>
        <span id="nowTime"><span id="nowHms">--:--:--</span><span class="clock-dot">.</span><span id="nowCs">--</span></span>
      </div>
      <button class="iconbtn menu" id="menuBtn" aria-label="menu">
        <span class="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </header>
    <section class="list" id="list"></section>
  </main>
  <button class="fab" id="fab" aria-label="add"></button>
  <!-- === 設定パネル === -->
  <aside class="panel glass" id="panel">
    <div class="prow">
      <span class="ic">
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="1.7"
             stroke-linecap="round"
             stroke-linejoin="round"
             width="22"
             height="22">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
      </span>
      <span class="sp"></span>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet"></section>
</body>
</html>
